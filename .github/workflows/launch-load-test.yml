name: Launch Load Test Swarm

on:
  workflow_dispatch:
    inputs:
      workers:
        description: 'Number of workers'
        required: true
        default: '3'
        type: choice
        options: ['1', '2', '3', '5', '10']
      instance_type:
        description: 'EC2 instance type'
        required: true
        default: 't3.medium'
        type: choice
        options: ['t3.small', 't3.medium', 't3.large', 't3.xlarge']
      max_duration_hours:
        description: 'Max runtime (hours) - auto-terminates after this'
        required: true
        default: '2'
        type: number
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options: ['staging', 'production']

      # Test Configuration
      scenario:
        description: 'Test scenario'
        required: true
        default: 'place_order'
        type: choice
        options: ['place_order', 'visit_widget', 'rush']
      test_duration_minutes:
        description: 'Test duration (minutes)'
        required: true
        default: '5'
        type: number

      # Optional Overrides (leave empty to use environment defaults)
      users:
        description: 'Number of users (default: 100 staging, 500 prod)'
        required: false
        type: string
      spawn_rate:
        description: 'Spawn rate (default: 1 staging, 4 prod)'
        required: false
        type: string
      host:
        description: 'Target host (default: staging or prod based on environment)'
        required: false
        type: string
      booking_fee_id:
        description: 'Booking Fee ID (default: 306 staging, 154 prod)'
        required: false
        type: string
      slug:
        description: 'Provider slug (default: pretend-school staging, sawyer-engineering-test-provider prod)'
        required: false
        type: string
      actually_place_orders:
        description: 'Actually place orders (WARNING: creates real orders!)'
        required: false
        type: boolean
        default: false

      # Heroku Dyno Scaling (leave empty to use environment defaults)
      min_dynos:
        description: 'Minimum dynos (default: 5 staging, 10 prod)'
        required: false
        type: string
      max_dynos:
        description: 'Maximum dynos (default: 15 staging, 30 prod)'
        required: false
        type: string

      # Aurora Database Scaling (leave empty to use environment defaults)
      min_acu:
        description: 'Aurora minimum ACUs (default: 4 staging, 8 prod)'
        required: false
        type: string
      max_acu:
        description: 'Aurora maximum ACUs (default: 32 staging, 64 prod)'
        required: false
        type: string

jobs:
  launch-swarm:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hour max workflow timeout

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for existing swarms
        id: check_existing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # Check if there are already running Locust instances
          EXISTING=$(aws ec2 describe-instances \
            --filters "Name=tag:Role,Values=master,worker" "Name=instance-state-name,Values=running,pending" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)

          if [ -n "$EXISTING" ]; then
            echo "⚠️  Found existing Locust instances: $EXISTING"
            echo "   Terminate them first or wait for auto-termination"
            exit 1
          fi
          echo "✓ No existing swarms found"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set test parameters with environment defaults
        id: test_params
        run: |
          # Set defaults based on environment
          if [ "${{ inputs.environment }}" == "staging" ]; then
            DEFAULT_USERS=100
            DEFAULT_SPAWN_RATE=1
            DEFAULT_HOST="https://staging.hisawyer.com"
            DEFAULT_BOOKING_FEE_ID=306
            DEFAULT_SLUG="pretend-school"
            DEFAULT_MIN_DYNOS=5
            DEFAULT_MAX_DYNOS=15
            DEFAULT_MIN_ACU=4
            DEFAULT_MAX_ACU=32
            HEROKU_APP="sawyer-staging"
          else
            DEFAULT_USERS=500
            DEFAULT_SPAWN_RATE=4
            DEFAULT_HOST="https://www.hisawyer.com"
            DEFAULT_BOOKING_FEE_ID=154
            DEFAULT_SLUG="sawyer-engineering-test-provider"
            DEFAULT_MIN_DYNOS=10
            DEFAULT_MAX_DYNOS=30
            DEFAULT_MIN_ACU=8
            DEFAULT_MAX_ACU=64
            HEROKU_APP="sawyer-prod"
          fi

          # Use override if provided, otherwise use default
          USERS="${{ inputs.users }}"
          USERS=${USERS:-$DEFAULT_USERS}

          SPAWN_RATE="${{ inputs.spawn_rate }}"
          SPAWN_RATE=${SPAWN_RATE:-$DEFAULT_SPAWN_RATE}

          HOST="${{ inputs.host }}"
          HOST=${HOST:-$DEFAULT_HOST}

          BOOKING_FEE_ID="${{ inputs.booking_fee_id }}"
          BOOKING_FEE_ID=${BOOKING_FEE_ID:-$DEFAULT_BOOKING_FEE_ID}

          SLUG="${{ inputs.slug }}"
          SLUG=${SLUG:-$DEFAULT_SLUG}

          MIN_DYNOS="${{ inputs.min_dynos }}"
          MIN_DYNOS=${MIN_DYNOS:-$DEFAULT_MIN_DYNOS}

          MAX_DYNOS="${{ inputs.max_dynos }}"
          MAX_DYNOS=${MAX_DYNOS:-$DEFAULT_MAX_DYNOS}

          MIN_ACU="${{ inputs.min_acu }}"
          MIN_ACU=${MIN_ACU:-$DEFAULT_MIN_ACU}

          MAX_ACU="${{ inputs.max_acu }}"
          MAX_ACU=${MAX_ACU:-$DEFAULT_MAX_ACU}

          # Export to outputs
          echo "users=$USERS" >> $GITHUB_OUTPUT
          echo "spawn_rate=$SPAWN_RATE" >> $GITHUB_OUTPUT
          echo "host=$HOST" >> $GITHUB_OUTPUT
          echo "booking_fee_id=$BOOKING_FEE_ID" >> $GITHUB_OUTPUT
          echo "slug=$SLUG" >> $GITHUB_OUTPUT
          echo "scenario=${{ inputs.scenario }}" >> $GITHUB_OUTPUT
          echo "min_dynos=$MIN_DYNOS" >> $GITHUB_OUTPUT
          echo "max_dynos=$MAX_DYNOS" >> $GITHUB_OUTPUT
          echo "min_acu=$MIN_ACU" >> $GITHUB_OUTPUT
          echo "max_acu=$MAX_ACU" >> $GITHUB_OUTPUT
          echo "heroku_app=$HEROKU_APP" >> $GITHUB_OUTPUT

          echo "✓ Test parameters configured:"
          echo "  Users: $USERS"
          echo "  Spawn Rate: $SPAWN_RATE"
          echo "  Host: $HOST"
          echo "  Scenario: ${{ inputs.scenario }}"
          echo "  Booking Fee ID: $BOOKING_FEE_ID"
          echo "  Slug: $SLUG"
          echo "  Heroku App: $HEROKU_APP"
          echo "  Dynos: $MIN_DYNOS-$MAX_DYNOS"
          echo "  Aurora ACUs: $MIN_ACU-$MAX_ACU"
          sed -i "s/INSTANCE_TYPE=\"t3.medium\"/INSTANCE_TYPE=\"${{ inputs.instance_type }}\"/" launch-swarm.sh

          # Update test parameters in setup scripts
          sed -i "s|--scenario=place_order|--scenario=${{ steps.test_params.outputs.scenario }}|g" swarm_scripts/master_setup.sh
          sed -i "s|--slug=pretend-school|--slug=${{ steps.test_params.outputs.slug }}|g" swarm_scripts/master_setup.sh
          sed -i "s|--booking_fee_id=306|--booking_fee_id=${{ steps.test_params.outputs.booking_fee_id }}|g" swarm_scripts/master_setup.sh
          sed -i "s|--host=https://staging.hisawyer.com|--host=${{ steps.test_params.outputs.host }}|g" swarm_scripts/master_setup.sh

          sed -i "s|--scenario=place_order|--scenario=${{ steps.test_params.outputs.scenario }}|g" swarm_scripts/worker_setup.sh
          sed -i "s|--slug=pretend-school|--slug=${{ steps.test_params.outputs.slug }}|g" swarm_scripts/worker_setup.sh
          sed -i "s|--booking_fee_id=306|--booking_fee_id=${{ steps.test_params.outputs.booking_fee_id }}|g" swarm_scripts/worker_setup.sh
          sed -i "s|--host=https://staging.hisawyer.com|--host=${{ steps.test_params.outputs.host }}|g" swarm_scripts/worker_setup.sh

          # Add --actually-place-orders flag if enabled
          if [ "${{ inputs.actually_place_orders }}" == "true" ]; then
            echo "⚠️  WARNING: Orders will actually be placed!"
            sed -i "s|--host=|--actually-place-orders --host=|g" swarm_scripts/master_setup.sh
            sed -i "s|--host=|--actually-place-orders --host=|g" swarm_scripts/worker_setup.sh
          else
            echo "✓ Orders will NOT be placed (safe mode)"
          fi

          echo "✓ Updated launch script and setup scripts with configuration"

      - name: Create .env file
        run: |
          echo "LOAD_TEST_TOKEN=${{ secrets.LOAD_TEST_TOKEN }}" > .env
          echo "✓ Created .env file with token"

      - name: Scale up infrastructure via API
        run: |
          echo "📈 Scaling up infrastructure for load test..."

          # Determine the host URL based on heroku_app
          if [ "${{ steps.test_params.outputs.heroku_app }}" == "sawyer-staging" ]; then
            HOST_URL="https://staging.hisawyer.com"
          else
            HOST_URL="https://www.hisawyer.com"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.LOAD_TEST_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "min_dynos": ${{ steps.test_params.outputs.min_dynos }},
              "max_dynos": ${{ steps.test_params.outputs.max_dynos }},
              "min_acu": ${{ steps.test_params.outputs.min_acu }},
              "max_acu": ${{ steps.test_params.outputs.max_acu }},
              "duration_minutes": ${{ inputs.test_duration_minutes }}
            }' \
            "${HOST_URL}/api/v1/load_tests/scale_up")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "❌ Failed to scale up infrastructure (HTTP $http_code)"
            exit 1
          fi

          echo "✅ Infrastructure scaled up successfully"

      - name: Wait for infrastructure scaling
        run: |
          echo "⏳ Waiting 3 minutes for dynos and database to scale up..."
          sleep 180
          echo "✓ Scaling wait complete"

      - name: Launch EC2 swarm
        id: launch
        run: |
          # Make script executable
          chmod +x launch-swarm.sh

          # Launch the swarm
          ./launch-swarm.sh | tee launch-output.txt

          # Extract instance IDs and IPs from output
          MASTER_IP=$(grep "Master Public IP:" launch-output.txt | awk '{print $NF}')

          echo "master_ip=$MASTER_IP" >> $GITHUB_OUTPUT
          echo "launch_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT

      - name: Display swarm information
        run: |
          # Output as a notice for immediate visibility
          echo "::notice title=Web UI Ready::🌐 Access Locust at http://${{ steps.launch.outputs.master_ip }}:8089 (wait 3-5 min for setup)"

          # Also write to step summary
          echo "## 🚀 Load Test Swarm Launched!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Workers: ${{ inputs.workers }}" >> $GITHUB_STEP_SUMMARY
          echo "- Instance Type: ${{ inputs.instance_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Max Duration: ${{ inputs.max_duration_hours }} hours" >> $GITHUB_STEP_SUMMARY
          echo "- Launch Time: ${{ steps.launch.outputs.launch_time }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Access:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Web UI: http://${{ steps.launch.outputs.master_ip }}:8089" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Setup Progress:**" >> $GITHUB_STEP_SUMMARY
          echo "- Wait 3-5 minutes for instances to configure" >> $GITHUB_STEP_SUMMARY
          echo "- Workers will auto-connect to master" >> $GITHUB_STEP_SUMMARY
          echo "- Check worker count in top-right of Web UI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Auto-Termination:**" >> $GITHUB_STEP_SUMMARY
          echo "- Swarm will auto-terminate in ${{ inputs.max_duration_hours }} hour(s)" >> $GITHUB_STEP_SUMMARY
          echo "- Or manually terminate with: \`./terminate-swarm.sh\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Monitor this workflow to see when auto-termination occurs." >> $GITHUB_STEP_SUMMARY

      - name: Wait for setup to complete
        run: |
          echo "⏳ Waiting 5 minutes for instances to configure..."
          sleep 300
          echo "✓ Initial setup should be complete"

      - name: Verify swarm is healthy
        run: |
          MASTER_IP="${{ steps.launch.outputs.master_ip }}"

          # Try to reach the web UI
          echo "Checking if Locust Web UI is accessible..."
          if curl -s -o /dev/null -w "%{http_code}" "http://$MASTER_IP:8089" | grep -q "200"; then
            echo "✓ Web UI is accessible at http://$MASTER_IP:8089"
          else
            echo "⚠️  Web UI not yet accessible. May need more time to start."
            echo "   Check Web UI manually in a few minutes."
          fi

      - name: Start load test
        id: start_test
        run: |
          MASTER_IP="${{ steps.launch.outputs.master_ip }}"
          USERS="${{ steps.test_params.outputs.users }}"
          SPAWN_RATE="${{ steps.test_params.outputs.spawn_rate }}"

          echo "🚀 Starting load test..."
          echo "  Users: $USERS"
          echo "  Spawn Rate: $SPAWN_RATE"
          echo "  Duration: ${{ inputs.test_duration_minutes }} minutes"

          # Start the swarm via API
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "http://$MASTER_IP:8089/swarm" \
            -d "user_count=$USERS" \
            -d "spawn_rate=$SPAWN_RATE")

          if [ "$HTTP_CODE" == "200" ]; then
            echo "✓ Load test started successfully"
            echo "start_time=$(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to start load test (HTTP $HTTP_CODE)"
            exit 1
          fi

          # Update summary with test execution info
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 🏃 Load Test Running" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Configuration:**" >> $GITHUB_STEP_SUMMARY
          echo "- Scenario: ${{ steps.test_params.outputs.scenario }}" >> $GITHUB_STEP_SUMMARY
          echo "- Users: $USERS" >> $GITHUB_STEP_SUMMARY
          echo "- Spawn Rate: $SPAWN_RATE users/sec" >> $GITHUB_STEP_SUMMARY
          echo "- Host: ${{ steps.test_params.outputs.host }}" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${{ inputs.test_duration_minutes }} minutes" >> $GITHUB_STEP_SUMMARY
          echo "- Actually Place Orders: ${{ inputs.actually_place_orders }}" >> $GITHUB_STEP_SUMMARY
          echo "- Started: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Monitor test execution
        run: |
          MASTER_IP="${{ steps.launch.outputs.master_ip }}"
          DURATION_SECONDS=$((60 * ${{ inputs.test_duration_minutes }}))

          echo "⏱️  Test will run for ${{ inputs.test_duration_minutes }} minute(s)..."
          echo "   Monitor progress at: http://$MASTER_IP:8089"

          # Sleep for the test duration
          sleep $DURATION_SECONDS

          echo "✓ Test duration completed"

      - name: Stop load test and download results
        id: results
        if: always()  # Run even if monitoring step is cancelled
        run: |
          MASTER_IP="${{ steps.launch.outputs.master_ip }}"

          echo "🛑 Stopping load test..."

          # Stop the test
          curl -X GET "http://$MASTER_IP:8089/stop" || echo "Test may already be stopped"

          # Download results CSV
          echo "📊 Downloading results..."
          curl -o results.csv "http://$MASTER_IP:8089/stats/requests/csv"
          curl -o results_stats.csv "http://$MASTER_IP:8089/stats/requests_full_history/csv"
          curl -o results_failures.csv "http://$MASTER_IP:8089/exceptions/csv"

          echo "✓ Results downloaded"
          echo "results_downloaded=true" >> $GITHUB_OUTPUT

      - name: Upload test results
        if: steps.results.outputs.results_downloaded == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results-${{ inputs.environment }}-${{ github.run_number }}
          path: |
            results.csv
            results_stats.csv
            results_failures.csv
          retention-days: 30

      - name: Display test summary
        if: steps.results.outputs.results_downloaded == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Load Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Completed at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Results available in workflow artifacts**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Quick stats from results:" >> $GITHUB_STEP_SUMMARY

          # Show summary from CSV
          if [ -f results.csv ]; then
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            head -20 results.csv >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Scale down infrastructure via API
        if: always()  # Run cleanup even if tests fail
        run: |
          echo "🔻 Scaling down infrastructure..."

          # Determine the host URL based on heroku_app
          if [ "${{ steps.test_params.outputs.heroku_app }}" == "sawyer-staging" ]; then
            HOST_URL="https://staging.hisawyer.com"
          else
            HOST_URL="https://www.hisawyer.com"
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.LOAD_TEST_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${HOST_URL}/api/v1/load_tests/scale_down")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "Response: $body"

          if [ "$http_code" != "200" ]; then
            echo "⚠️  Failed to scale down infrastructure (HTTP $http_code)"
            echo "You may need to manually restore infrastructure"
            # Don't exit 1 here - we want to continue with EC2 cleanup
          else
            echo "✅ Infrastructure restored successfully"
          fi

      - name: Terminate swarm
        if: always()  # Always run cleanup, even if previous steps fail
        run: |
          chmod +x terminate-swarm.sh
          ./terminate-swarm.sh || echo "⚠️  Termination may have failed. Check AWS console."

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## ✅ Swarm Terminated" >> $GITHUB_STEP_SUMMARY
          echo "Terminated at: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY

      - name: Upload launch logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-logs
          path: launch-output.txt
          retention-days: 7
